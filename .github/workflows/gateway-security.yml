name: Gateway Security

on:
  pull_request:
    paths:
      - "app/gateway/**"
      - "app/backend/main.py"
      - "app/backend/security.py"
      - "tests/backend/**"
      - "vercel.json"
      - ".github/workflows/gateway-security.yml"
  push:
    branches:
      - "feat/**"
      - "security/**"
    paths:
      - "app/gateway/**"
      - "app/backend/main.py"
      - "app/backend/security.py"
      - "tests/backend/**"
      - "vercel.json"
      - ".github/workflows/gateway-security.yml"

jobs:
  gateway-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax-check gateway
        run: node --check app/gateway/gateway.mjs
      - name: Test gateway and Vercel service boundaries
        run: node --test app/gateway/test/*.test.mjs
      - name: Validate Vercel service configuration
        run: node -e "JSON.parse(require('node:fs').readFileSync('vercel.json', 'utf8'))"

  backend-security-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: snok/install-poetry@v1
        with:
          version: "1.8.3"
      - name: Install dependencies
        run: poetry install --with dev --no-interaction
      - name: Run backend security boundary tests
        run: poetry run pytest -q tests/backend/test_security_boundaries.py
